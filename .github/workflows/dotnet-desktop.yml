name: BreachExplorer CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: src/BreachExplorer/BreachExplorer.csproj
      PUBLISH_DIR: /docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Run tests (if present)
        run: dotnet test --no-build --verbosity normal
        continue-on-error: true

      - name: Clean docs folder
        run: rm -rf ${{ env.PUBLISH_DIR }} && mkdir -p ${{ env.PUBLISH_DIR }}

      - name: Publish Blazor WASM to docs
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }} --no-build

      - name: Add GitHub Pages fallback (optional SPA fix)
        run: |
          cp ${{ env.PUBLISH_DIR }}/index.html ${{ env.PUBLISH_DIR }}/404.html || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: breach-explorer-web
          path: ${{ env.PUBLISH_DIR }}

      - name: Commit docs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs
          git commit -m "Update docs build [skip ci]" || echo "No changes to commit"
          git push
