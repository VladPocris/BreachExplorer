name: BreachExplorer CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: src/BreachExplorer/BreachExplorer.csproj
      PUBLISH_DIR: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Run tests (if present)
        run: dotnet test ${{ env.PROJECT_PATH }} --no-build --verbosity normal
        continue-on-error: true

      - name: Clean docs folder
        run: rm -rf docs && mkdir docs

      - name: Publish Blazor WASM
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o docs --no-build

      # IMPORTANT: move actual static site to /docs root
      - name: Move wwwroot contents
        run: |
          cp -r docs/wwwroot/* docs/
          rm -rf docs/wwwroot

      - name: Add GitHub Pages SPA fallback
        run: cp docs/index.html docs/404.html || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: breach-explorer-web
          path: docs

      - name: Commit docs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add docs
          git commit -m "Update docs build [skip ci]" || echo "No changes to commit"
      
          git pull --rebase origin main
          git push
