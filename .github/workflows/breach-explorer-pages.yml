name: BreachExplorer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT_PATH: src/BreachExplorer/BreachExplorer.csproj
  TEST_PROJECT_PATH: tests/PlaywriteTesting/PlaywriteTesting.csproj
  BLAZOR_URL: http://localhost:5241

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # Uses github-pages environment secrets/variables (not repository secrets)
    environment: github-pages

    env:
      CI: true
      BLAZOR_URL: http://localhost:5241
      # Environment variable first, then environment secret, then repository secret
      URL_BACKEND_API: ${{ vars.URL_BACKEND_API || secrets.URL_BACKEND_API }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configure test env.json
        run: |
          if [ -z "$URL_BACKEND_API" ]; then
            echo "::error::Set URL_BACKEND_API on the github-pages environment (Variables or Secrets), or as a repository Actions secret."
            exit 1
          fi
          printf '%s\n' "{\"URL_BACKEND_API\":\"${URL_BACKEND_API}\"}" > src/BreachExplorer/wwwroot/env.json

      - name: Build Blazor and tests
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore
          dotnet build ${{ env.TEST_PROJECT_PATH }} -c Release

      - name: Install Playwright browsers
        run: pwsh tests/PlaywriteTesting/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Start Blazor dev server
        run: |
          dotnet run --project ${{ env.PROJECT_PATH }} -c Release --no-launch-profile --urls ${{ env.BLAZOR_URL }} &
          echo $! > blazor.pid
          for i in $(seq 1 60); do
            if curl -sf "${{ env.BLAZOR_URL }}/" > /dev/null; then
              echo "Blazor is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Blazor dev server did not start"
          exit 1

      - name: Run Playwright tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c Release --no-build --verbosity normal

      - name: Stop Blazor dev server
        if: always()
        run: |
          if [ -f blazor.pid ]; then
            kill "$(cat blazor.pid)" || true
          fi

  build:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always() && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'failure' || needs.e2e-tests.result == 'skipped')
    environment: github-pages

    env:
      URL_BACKEND_API: ${{ vars.URL_BACKEND_API || secrets.URL_BACKEND_API }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Write production env.json (before publish)
        run: |
          if [ -z "$URL_BACKEND_API" ]; then
            echo "::error::Set URL_BACKEND_API on the github-pages environment (Variables or Secrets), or as a repository Actions secret."
            exit 1
          fi
          printf '%s\n' "{\"URL_BACKEND_API\":\"${URL_BACKEND_API}\"}" > src/BreachExplorer/wwwroot/env.json
          cat src/BreachExplorer/wwwroot/env.json

      - name: Publish Blazor WASM
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -o publish -p:BaseHref=/BreachExplorer/

      - name: Write env.json into publish output
        run: |
          # .NET 8 Blazor publish puts static files under publish/wwwroot/
          ENV_FILE="publish/wwwroot/env.json"
          if [ ! -d publish/wwwroot ]; then
            echo "::error::Expected publish/wwwroot after dotnet publish"
            find publish -maxdepth 3 -type f | head -50
            exit 1
          fi
          printf '%s\n' "{\"URL_BACKEND_API\":\"${URL_BACKEND_API}\"}" > "$ENV_FILE"
          echo "Published env.json:"
          cat "$ENV_FILE"
          if grep -q 'localhost' "$ENV_FILE"; then
            echo "::error::env.json must not contain localhost"
            exit 1
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p pages
          cp -r publish/wwwroot/* pages/
          cp pages/index.html pages/404.html
          touch pages/.nojekyll

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
